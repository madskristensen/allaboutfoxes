title: All About Foxes
description: A little place for big discoveries about foxes. A wildlife learning adventure for curious kids, created for Wesley.
url: "https://www.allaboutfoxes.com"
baseurl: ""
lang: en
locale: en_US
timezone: Etc/UTC
markdown: kramdown
permalink: pretty
strict_front_matter: true
liquid:
  error_mode: strict
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: { path: /assets/images/social-card.png, width: 1200, height: 630, alt: "All About Foxes. A curious kid's field guide, with an illustrated red fox among woodland trees." }
exclude:
  - .vs
  - _templates
  - Gemfile
  - Gemfile.lock
  - README.md
  - run.cmd
  - scripts
  - vendor