    <text x="66" y="176">Existing rock crevice</text>
    <text x="69" y="204" font-size="17" fill="#536353">One possible den site</text>
    <text x="674" y="144">Coastal scrub</text>
    <text x="126" y="535">Sheltered entrance</text>
    <text x="509" y="541">Two dark newborn pups</text>
    <text x="45" y="595" font-size="17" fill="#536353">Other dens use hollow trees, shrubs, or ground holes. Never approach a wild den.</text>
