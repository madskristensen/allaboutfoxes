<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Fox Knowledge Quiz sharing card</title>
  <desc id="desc">A woodland field notebook with a friendly fox and three checked discoveries beside the invitation to test your fox knowledge.</desc>
