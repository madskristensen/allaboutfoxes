<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A gray fox den in a hollow log</title>
  <desc id="description">An illustrative ground-level cutaway of a fallen hollow log. An opening on the left leads into a sheltered cavity beneath a shell of wood. An adult gray fox and four dark pups rest inside. Other gray fox dens may be in rocks, trees, brush piles, or burrows.</desc>
  <defs>
    <pattern id="bark" width="80" height="38" patternUnits="userSpaceOnUse"><rect width="80" height="38" fill="#947558"/><path d="M5 10h42m8 16h21M9 31h28" stroke="#704b36" stroke-width="3" stroke-linecap="round"/></pattern>
    <g id="pup"><ellipse cx="0" cy="0" rx="24" ry="15" fill="#625347"/><path d="M13-2c25-12 37 2 21 11-10 4-21 1-27-3" fill="#51483c"/><path d="m-23-4 2-19 12 13 14-9 3 21-19 10Z" fill="#807460"/><path d="m-14 1 6 0-3 4Z" fill="#243e32"/><path d="m-21-5 5 1m11-1 5-1" stroke="#243e32" stroke-width="2" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="650" rx="20" fill="#edf0e6"/>
  <text x="40" y="42" fill="#536353" font-family="Verdana, sans-serif" font-size="14" letter-spacing="2">THE GRAY FOX / A DIFFERENT KIND OF DEN</text>
  <text x="40" y="90" fill="#243e32" font-family="Georgia, serif" font-size="36">Shelter inside a fallen hollow log</text>
