  <path d="m300 304 42 10-13 59 8 20h-54l3-40Zm268-9 40 4-4 73 18 21h-54l-9-44Z" fill="#b87546"/>
  <path d="m231 225 6-68 44 61 24-37 18 69-22 60-62 7-67-40 45-28Z" fill="url(#grizzle)"/>
  <path d="m242 179 25 36-29 6Zm62 23 10 39-20-9Z" fill="#704b36"/>
