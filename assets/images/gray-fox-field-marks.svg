  <path d="m172 272 19-1-8 12Z" fill="#243e32"/>
  <path d="m227 253 12 3m-9 4 9 10" stroke="#343d35" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#657e61" stroke-width="2" stroke-dasharray="4 5"><path d="M445 232V121H338"/><path d="M301 380v54h99"/><path d="M716 281V164h-72"/><path d="M839 338v90h-97"/></g>
  <g fill="#a94727"><circle cx="445" cy="232" r="5"/><circle cx="301" cy="380" r="5"/><circle cx="716" cy="281" r="5"/><circle cx="839" cy="338" r="5"/></g>
  <g fill="#243e32" font-family="Georgia, serif" font-size="24"><text x="94" y="127">Grizzled gray back</text><text x="410" y="443">Rusty legs</text><text x="570" y="113">Black stripe</text><text x="570" y="142">on top of the tail</text><text x="690" y="459">Black tail tip</text></g>
