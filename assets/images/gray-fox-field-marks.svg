<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Gray fox field marks</title>
  <desc id="description">A compact gray fox has a grizzled gray back, reddish-brown sides and legs, a pale throat, and a long tail with a black stripe on top ending in a black tip. An inset shows a simplified hooked claw gripping tree bark.</desc>
  <defs>
    <pattern id="grizzle" width="21" height="19" patternUnits="userSpaceOnUse"><rect width="21" height="19" fill="#8d9084"/><path d="m3 5 5 2m4 8 4-2" stroke="#d5d7c9" stroke-width="2" stroke-linecap="round"/></pattern>
  </defs>
  <rect width="960" height="560" rx="20" fill="#edf0e6"/>
  <text x="40" y="42" fill="#536353" font-family="Verdana, sans-serif" font-size="14" letter-spacing="2">THE GRAY FOX / FOLLOW THE FIELD MARKS</text>
  <ellipse cx="482" cy="396" rx="315" ry="14" fill="#dce3d1"/>
  <path d="M566 260c103-48 200-14 297 81-71 65-191 26-264-30Z" fill="#8d9084"/>
