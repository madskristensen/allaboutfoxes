    <path d="M302 237c43-34 124-44 206-22 71 18 115 56 124 102l-38 30-249-5-58-47Z" fill="#faf7ef"/>
    <path d="m347 314 39 5-12 57 11 15h-55l-5-20Zm185 4 41 2 7 53 18 17h-59l-12-33Z" fill="#e2e4d8"/>
    <path d="m302 305 45 13-14 56 9 18h-63l4-29Zm278 1 43-2-2 64 18 24h-60l-7-40Z" fill="#faf7ef"/>
