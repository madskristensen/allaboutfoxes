<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Arctic fox field marks and coat morphs</title>
  <desc id="description">A compact white winter fox has rounded ears, a short muzzle, short legs, furry paws, and a thick tail without a contrasting tip. Four swatches compare white-morph summer and winter coats with blue-morph summer and winter coats. Blue morphs stay dark rather than turning white.</desc>
  <rect width="960" height="600" rx="20" fill="#edf0e6"/>
  <text x="40" y="42" fill="#536353" font-family="Verdana, sans-serif" font-size="14" letter-spacing="2">THE ARCTIC FOX / LOOK BEYOND THE COLOR</text>
  <ellipse cx="498" cy="388" rx="315" ry="15" fill="#dce3d1"/>
  <g stroke="#8e9e86" stroke-width="3" stroke-linejoin="round">
