  <g font-family="Verdana, sans-serif" font-size="21" fill="#243e32">
    <text x="47" y="181">Contrasting face</text>
    <text x="647" y="165">Grizzled gray back</text>
    <text x="90" y="474">Rusty sides</text>
    <text x="653" y="493">Dark tail stripe</text>
    <text x="47" y="118" font-size="17" fill="#536353">Six island populations / Size and location matter, not just coat color</text>
    <text x="45" y="532" font-size="17" fill="#536353">Urocyon littoralis / Not to scale against our mainland gray fox</text>
  </g>
