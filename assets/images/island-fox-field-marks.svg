<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Island fox field marks</title>
  <desc id="desc">A small gray-backed fox with rusty sides, contrasting face markings, and a dark stripe on its tail. Location and size matter as well as color.</desc>
