<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Inside an Arctic fox tundra den</title>
  <desc id="description">Four openings in a low treeless mound connect through branching tunnels in sandy, seasonally thawed soil. A nursery holds a brown summer-coated adult and seven dark pups. A schematic frozen-ground layer lies below the passages. This is an illustrative summer cutaway, not a measured den or a fixed thaw depth.</desc>
