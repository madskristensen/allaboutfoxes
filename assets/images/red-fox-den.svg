<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Inside a red fox den</title>
  <desc id="description">A cutaway through a grassy bank shows three entrances connected by narrow, branching tunnels. A short side passage leads to a small side chamber, while the main passage reaches a larger nursery chamber holding a mother fox and five kits. This source-informed example brings the branches into view; it is not to scale or a map of one particular den. Real dens vary in shape and complexity.</desc>
